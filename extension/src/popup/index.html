<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cyclops</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="eye"></span>
        <div>
          <h1>Cyclops</h1>
          <p class="tag">private vision agent</p>
        </div>
      </div>
      <div class="head-right">
        <span id="server-dot" class="dot" title="server status"></span>
        <button id="gear" class="gear" title="Screen graph, privacy and vault">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.65-.07-.97l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65a.49.49 0 0 0-.49-.42h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.97s.03.65.07.97L2.47 14.6a.5.5 0 0 0-.12.64l2 3.46c.14.24.44.34.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.17.12.47.02.61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- The conversation. Chat turns and step rows share one stream so the
         redaction proof stays on screen next to what the agent said. -->
    <main id="thread" class="thread"></main>

    <div class="composer">
      <textarea
        id="goal"
        rows="2"
        placeholder="What should I do on this page?"
      ></textarea>
      <div class="row">
        <button id="run" class="primary">Run</button>
        <button id="stop">Stop</button>
        <span id="state" class="state">idle</span>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
